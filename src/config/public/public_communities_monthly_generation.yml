resource:
  name: "public_communities_monthly_generation"
  title: "Monthly electrical generation by community"
  description: |
    This dataset is monthly electrical generation aggregated by grid and associated with every community connected to the grid. It summarizes the amount of electrical power produced for a community and the fuels that were used to generate it. Two factors complicate this simple seeming dataset. First, there is no single state or federal agency that collects data on all the generation sources in Alaska. Second, some communities have isolated microgrids where generation sources are easy to identify, but other communities are interconnected with interties into grids where generation sources are shared. In those cases, it is therefore impossible to pair communities with the individual power stations or plants or operators for which generation is recorded even if the plant is physically located within a community.
    To address the first issue, this dataset derives from the Alaska Energy Statistics workbooks, which in turn compiles data from multiple sources including community Power Cost Equalization reports collated by the Alaska Energy Authority and reporting to the U.S. Energy Information Administration (EIA). Source data was harmonized to account for differences in reporting through a combination of subject matter expertise and transformations.
    To address the second issue, generation is summed over all the generators with different fuels - diesel and natural gas boilers, solar installations, wind turbines - that are connected to a grid. Grids were defined as an element of the Alaska Energy Statistics workbooks for PCE communities; for the Railbelt, they were determined by the service areas of the utilities that are connected to the Railbelt intertie. The same values for total generation are reported for all the communities on a grid, which creates multiple duplicate values in this dataset.
  path: "https://raw.githubusercontent.com/acep-aedg/aedg-data-pond/refs/heads/main/data/public/public_communities_monthly_generation.csv"
  keywords:
    - generation
    - electricity
    - fuel type
    - grid
    - intertie
    - reports
    - Power Cost Equalization (PCE)
    - EIA Form 923
    - place
  topics:
    - Electricity
  sources:
    - dcra.communities
    - dol.places
    - acep.es_generation
  licenses:
    - CC-SA-4.0
  spatial:
    name: Alaska
    boundingBox: [-187.55, 51.21, -130.0, 71.35]
    crs: OGC:CRS84
  temporal:
    referenceDate: "2025-01-01"  # equivalent to as_of_date
    timeseries:  # is a list of possibly multiple time periods
      -
        start: "2021-01"
        end: "2021-12"
        resolutionValue: "1"
        resolutionUnit: month
        alignment: null
        aggregationType: sum
  fields: # column names
    - fips_code
    - grid_id
    - name
    - net_generation_mwh
    - fuel_type
    - year
    - month
  primaryKey: # An array of fields that uniquely identifies each row in the table
    - grid_id
    - fuel_type
    - year
    - month
