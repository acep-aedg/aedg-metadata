  source:
    name: Alaska Division of Community and Regional Affairs
    url: https://maps.commerce.alaska.gov/server/rest/services/Community_Related/Community_Locations_and_Boundaries/MapServer/0
  files:
    dcra.communities:
      file_type: geojson
      url: https://maps.commerce.alaska.gov/server/rest/services/Community_Related/Community_Locations_and_Boundaries/MapServer/0/query?outFields=*&where=1%3D1&f=geojson
      sha256: 241f72c362a2184d55463b0a87c5add891aa95bfefa3547f8d01eb636052b44f
      save_as: 'source/dcra.communities/data/dcra.communities.geojson'
preprocess:
  archive: # path to archive when data is zipped put .zip
  inputs:
    dcra.communities: 'source/dcra.communities/data/dcra.communities.geojson'
  outputs:
    dcra.communities: 'preprocess/communities/data/communities.geojson'
