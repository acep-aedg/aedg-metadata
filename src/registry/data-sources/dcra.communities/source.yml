database:
  ddl-info:
    dcra.communities:
      location: load2/communities/ddl.sql
      table-name: l1_communities
metadata:
  title: Alaska Communities
  authors:
  - Alaska Division of Community and Regional Affairs (DCRA)
  description: |
    The Alaska Communities dataset is the master list of place locations, represented as points, used by the Alaska Division of Community and Regional Affairs (DCRA). In includes community locations but for historical reasons, it is a mix of Communities, Places of Interest, Borough/Census Area as well as Alaska centroid. DCRA uses it to link communities to their internal key GUID used elsewhere in their systems.
    AEDG uses this list to define canonical community names since, as free text, these can vary in different contexts, and to establish locations to use in spatial joins and relations.
  publicationYear: "2023"
  path: https://maps.commerce.alaska.gov/server/rest/services/Community_Related/Community_Locations_and_Boundaries/MapServer/0
  sourceLicenses: # has a disclaimer where the license should be
  - null
