metadata:
  title: Places (Cities and CDPs) Shapefile
  authors:
  - Alaska Department of Labor and Workforce Development (DOLWD)
  description: |
    An ESRI Shapefile for use in GIS software that contains data from the 2020 US Census for Alaska at
    the place level. The definition of places includes all incorporated cities as well as census designated
    places (CDPs). Each geographic unit is identified using Federal Information Processing Standards (FIPS)
    numbers. Coordinate System: North American Datum 1983 Alaska Albers. Source: 2020 US Census,
    PL94-171 Redistricting File; 2020 US Census Tiger Shapefiles. Documentation of field names:
    https://live.laborstats.alaska.gov/cen/maps/gis/Places2020.pdf
  publicationYear: 2020
  path: https://live.laborstats.alaska.gov/article/maps-gis-data
