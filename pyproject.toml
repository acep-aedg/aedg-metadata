[project]
name = "aedg_metadata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Elizabeth (Liz) Dobbins", email = "eldobbins@alaska.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23.0",
    "oemetadata>=2.0.4",
    "pyyaml>=6.0.2",
    "typer>=0.15.2",
]

[project.scripts]
aedg_metadata = "aedg_metadata.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
# from https://learn.scientific-python.org/development/guides/pytest/
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
log_cli_level = "info"
testpaths = [
  "tests",
]
